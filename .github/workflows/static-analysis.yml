# Quality gate del código: tipos, formato, ESLint (incluye eslint-plugin-security) sin warnings,
# complejidad cognitiva ≤ 15 por función (sonarjs) y duplicación ≤ 3% (jscpd).
name: Static analysis

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Prettier
        run: npm run format:check
      - name: ESLint (0 errores, 0 warnings, complejidad cognitiva ≤ 15)
        run: npm run lint
      - name: Duplicación de código (≤ 3%)
        run: npm run duplication
