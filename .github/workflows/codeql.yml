# SAST de JS/TS. Las alertas High/Critical bloquean el merge mediante la regla
# "Code scanning results" de la protección de ramas (Settings > Rules).
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    - cron: '0 13 * * 1'   # lunes, para detectar consultas nuevas sobre código que no cambió

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
