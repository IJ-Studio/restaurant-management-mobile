# .github/workflows/ci.yml
# =====================================================================================================
# Pipeline de calidad (CI) de la app móvil.
#
# Corre en cada push y en cada PR hacia main, develop y release/**. Está organizado por ETAPAS en un
# solo workflow, porque `needs:` solo encadena jobs del mismo workflow:
#
#   Etapa 1 (en paralelo)  static-analysis ──┐        security ──┐   (CodeQL corre aparte: codeql.yml)
#   Etapa 2                unit-tests ◄──────┘                   │
#   Etapa 3                integration-tests                     │
#   Etapa 4                acceptance-tests                      │
#   Etapa 5                performance-tests                     │
#   Resultado              quality-gate ◄────────────────────────┘ (lee el resultado de todas)
#
# - Cada etapa de pruebas tiene `needs:` de la anterior: solo arranca si la anterior terminó en verde
#   (fail fast). Si el análisis estático falla, las demás quedan en "skipped".
# - `quality-gate` es el check obligatorio de main y develop. Falla si cualquier etapa falló, se
#   canceló o se saltó, así que un PR en rojo no se puede mergear.
# - cd-preview.yml y cd-release.yml esperan a que `quality-gate` esté en verde antes de compilar.
# - Las pruebas de esfuerzo corren en su propio workflow (stress-tests.yml).
#
# Reportes de cada etapa (artefactos, 30 días): static-analysis-report, unit-tests-report,
# integration-tests-report, acceptance-report y performance-report. Detalle: docs/testing-strategy.md.
# =====================================================================================================
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

# Mínimo privilegio: el pipeline solo lee el código (static-analysis amplía lo necesario para SARIF).
permissions:
  contents: read

# Si llega un push nuevo a la misma rama/PR, se cancela la corrida anterior (ya no sirve).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------------
  # ETAPA 1 · Análisis estático: revisa el código sin ejecutarlo y publica su informe.
  # Cada herramienta guarda su salida en reports/static aunque falle (continue-on-error) y el paso
  # "Veredicto" reprueba el job al final si alguna falló: así el informe se sube y el job falla igual.
  # ---------------------------------------------------------------------------------------------------
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # subir el SARIF de ESLint a Code scanning
      actions: read
    steps:
      - uses: actions/checkout@v7
      # Node 22 con caché de npm para no descargar las dependencias en cada corrida.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Instala exactamente lo que dice package-lock.json (falla si no coincide con package.json).
      - run: npm ci
      - run: mkdir -p reports/static

      - name: TypeScript (errores de tipos)
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee reports/static/tsc.txt

      - name: Prettier (formato)
        id: prettier
        continue-on-error: true
        run: |
          set -o pipefail
          npm run -s format:check 2>&1 | tee reports/static/prettier.txt

      # ESLint con --max-warnings 0. Incluye eslint-plugin-security (patrones inseguros) y
      # sonarjs/cognitive-complexity ≤ 15 por función (eslint.config.js). La primera corrida deja el
      # detalle legible en el log; la segunda, el JSON del informe.
      - name: ESLint (0 errores, 0 warnings, complejidad cognitiva ≤ 15)
        id: eslint
        continue-on-error: true
        run: |
          npx eslint . --max-warnings 0 -f json -o reports/static/eslint.json || true
          npx eslint . --max-warnings 0

      - name: ESLint → SARIF
        if: always()
        run: node scripts/ci/eslint-to-sarif.js reports/static/eslint.json reports/static/eslint.sarif

      # Los hallazgos aparecen en Security → Code scanning (categoría "eslint") y como anotaciones en el PR.
      - name: Subir SARIF a Code scanning
        if: always() && hashFiles('reports/static/eslint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/static/eslint.sarif
          category: eslint

      # jscpd: falla si más del 3% del código está duplicado (.jscpd.json). Informe HTML y JSON.
      - name: Duplicación de código (≤ 3%)
        id: jscpd
        continue-on-error: true
        run: |
          set -o pipefail
          npx jscpd --reporters console,html,json --output reports/static/jscpd 2>&1 | tee reports/static/jscpd.txt

      - name: Resumen del análisis estático
        if: always()
        env:
          TSC: ${{ steps.tsc.outcome }}
          PRETTIER: ${{ steps.prettier.outcome }}
          ESLINT: ${{ steps.eslint.outcome }}
          JSCPD: ${{ steps.jscpd.outcome }}
        run: node scripts/ci/static-summary.js reports/static >> "$GITHUB_STEP_SUMMARY"

      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: reports/static/
          retention-days: 30

      # Código de salida correcto: el job falla si cualquier herramienta falló.
      - name: Veredicto
        if: always()
        env:
          RESULTS: ${{ steps.tsc.outcome }} ${{ steps.prettier.outcome }} ${{ steps.eslint.outcome }} ${{ steps.jscpd.outcome }}
        run: |
          echo "tsc prettier eslint jscpd: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::El análisis estático reprobó ($RESULTS)."
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------------------------------
  # ETAPA 1 · Seguridad (SCA + secretos). Corre en paralelo con el análisis estático.
  # ---------------------------------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Gitleaks revisa todo el historial, no solo el último commit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SCA: falla con cualquier vulnerabilidad High o Critical en las dependencias.
      # Las únicas excepciones están justificadas en audit-ci.jsonc.
      - name: npm audit (High/Critical bloquea; excepciones en audit-ci.jsonc)
        run: npm run audit
      # Busca llaves, tokens y contraseñas en el código y en el historial de git.
      # El binario se descarga de la release oficial y se verifica su SHA-256 antes de usarlo.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          FILE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${FILE}"
          echo "${GITLEAKS_SHA256}  ${FILE}" | sha256sum -c -
          tar -xzf "$FILE" gitleaks
          ./gitleaks git --redact --verbose --no-banner .

  # ---------------------------------------------------------------------------------------------------
  # ETAPA 2 · Pruebas unitarias. Solo corre si el análisis estático pasó.
  # Excluye integración, aceptación y esfuerzo, y mide cobertura. Umbrales en jest.config.js:
  # ≥ 70% global y ≥ 80% de líneas en casos de uso, data/ y ViewModels.
  # ---------------------------------------------------------------------------------------------------
  unit-tests:
    name: unit-tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jest (unitarias) con cobertura
        run: >
          npm run test:unit -- --ci --coverage
          --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary
          --json --outputFile=jest-unit.json
      # Tabla de resultados y cobertura en la página del run (pestaña Summary).
      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = ["### Pruebas unitarias", ""];
            if (fs.existsSync("jest-unit.json")) {
              const r = require("./jest-unit.json");
              out.push(`- Suites: ${r.numPassedTestSuites}/${r.numTotalTestSuites} en verde`,
                       `- Pruebas: ${r.numPassedTests} en verde, ${r.numFailedTests} fallidas, ${r.numTotalTests} en total`, "");
            }
            if (fs.existsSync("coverage/coverage-summary.json")) {
              const t = require("./coverage/coverage-summary.json").total;
              out.push("| Cobertura | % | Cubierto |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`));
            }
            console.log(out.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-report
          path: |
            coverage/
            jest-unit.json
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------
  # ETAPA 3 · Pruebas de integración con datos de prueba. Solo corre si las unitarias pasaron.
  # Levantan la app con el grafo de dependencias real contra el API falso (src/core/testing/fakeApi.ts).
  # ---------------------------------------------------------------------------------------------------
  integration-tests:
    name: integration-tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jest (integración)
        run: npm run test:integration -- --ci --json --outputFile=jest-integration.json
      - name: Resumen de pruebas
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("jest-integration.json")) process.exit(0);
            const r = require("./jest-integration.json");
            console.log(["### Pruebas de integración", "",
              `- Suites: ${r.numPassedTestSuites}/${r.numTotalTestSuites} en verde`,
              `- Pruebas: ${r.numPassedTests} en verde, ${r.numFailedTests} fallidas, ${r.numTotalTests} en total`].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-report
          path: jest-integration.json
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------
  # ETAPA 4 · Pruebas de aceptación (criterio 6). Recorren la app completa por rol, como el usuario,
  # y cada prueba lleva el ID del criterio de su historia (HU-01 a HU-05). Si un criterio falla, si una
  # prueba no tiene ID o si un criterio no tiene prueba, el job falla.
  # Reportes: JUnit (reports/acceptance/junit.xml) y matriz de trazabilidad (traceability.md/json).
  # ---------------------------------------------------------------------------------------------------
  acceptance-tests:
    name: acceptance-tests
    needs: [static-analysis, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jest (aceptación) con JUnit y trazabilidad
        run: npm run test:acceptance -- --ci
      - name: Matriz de trazabilidad en el Summary
        if: always()
        run: |
          if [ -f reports/acceptance/traceability.md ]; then
            cat reports/acceptance/traceability.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó la matriz de trazabilidad: revisa el paso anterior." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: reports/acceptance/
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------
  # ETAPA 5 · Pruebas de rendimiento (criterio 9) con línea base y umbrales.
  # 1. Descarga la rama destino (develop en un PR; el commit anterior en un push) como línea base.
  # 2. Mide con Reassure tiempo y número de renders de Login, Menú, Pedido de mesa y Reservaciones,
  #    en 2 rondas ABBA (base, rama | rama, base) para cancelar el ruido del runner.
  # 3. Exporta el bundle de Android de ambos y compara su tamaño (también valida que compila).
  # 4. scripts/perf/check-performance.js aplica los umbrales y falla si se rebasa alguno:
  #    p10 del tiempo de render +10 % (y ≥ 1 ms), más renders que la base, bundle JS +5 %.
  # ---------------------------------------------------------------------------------------------------
  performance-tests:
    name: performance-tests
    needs: acceptance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Rama actual
        uses: actions/checkout@v7
        with:
          path: head
      # En un push que crea la rama, github.event.before es 0000…: no hay línea base que medir.
      - name: ¿Hay línea base?
        id: base
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay commit base para comparar; solo se mide la rama."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Línea base (rama destino)
        if: steps.base.outputs.has == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Dependencias
        run: |
          (cd head && npm ci)
          if [ -d base ]; then (cd base && npm ci); fi
      # La base mide sus pantallas con las MISMAS pruebas y datos que la rama.
      - name: Preparar la línea base
        if: steps.base.outputs.has == 'true'
        run: head/scripts/perf/prepare-baseline.sh head base
      - name: Reassure (2 rondas ABBA)
        run: |
          if [ -d base ]; then
            head/scripts/perf/measure-rounds.sh base head 2 perf
          else
            head/scripts/perf/measure-rounds.sh head head 1 perf
            rm perf/baseline.perf
          fi
      - name: Bundle de Android (expo export)
        run: |
          (cd head && npx expo export --platform android --output-dir ../dist-head)
          node head/scripts/perf/bundle-size.js dist-head perf/bundle-current.json
          if [ -d base ]; then
            (cd base && npx expo export --platform android --output-dir ../dist-base)
            node head/scripts/perf/bundle-size.js dist-base perf/bundle-baseline.json
          fi
      - name: Comparar contra la línea base y aplicar umbrales
        working-directory: head
        run: |
          ARGS=(--current ../perf/current.perf --bundle-current ../perf/bundle-current.json --out reports/performance)
          if [ -f ../perf/baseline.perf ]; then ARGS+=(--baseline ../perf/baseline.perf --bundle-baseline ../perf/bundle-baseline.json); fi
          node scripts/perf/check-performance.js "${ARGS[@]}"
      - name: Resumen de rendimiento
        if: always()
        run: |
          {
            if [ -f head/reports/performance/summary.md ]; then cat head/reports/performance/summary.md; fi
            if [ -f head/.reassure/output.md ]; then
              echo; echo "<details><summary>Reporte completo de Reassure (output.md)</summary>"; echo
              cat head/.reassure/output.md
              echo; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            head/.reassure/output.md
            head/.reassure/output.json
            head/reports/performance/
            perf/
          retention-days: 30

  # ---------------------------------------------------------------------------------------------------
  # RESULTADO · Quality gate. Siempre corre (`if: always()`), aunque una etapa haya fallado, para
  # dejar el veredicto y una tabla con el estado de cada etapa. Es el check obligatorio del repo.
  # ---------------------------------------------------------------------------------------------------
  quality-gate:
    name: quality-gate
    if: always()
    needs: [static-analysis, security, unit-tests, integration-tests, acceptance-tests, performance-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Veredicto
        env:
          STATIC: ${{ needs.static-analysis.result }}
          SECURITY: ${{ needs.security.result }}
          UNIT: ${{ needs.unit-tests.result }}
          INTEGRATION: ${{ needs.integration-tests.result }}
          ACCEPTANCE: ${{ needs.acceptance-tests.result }}
          PERFORMANCE: ${{ needs.performance-tests.result }}
        run: |
          {
            echo "### Quality gate"
            echo
            echo "| Etapa | Job | Resultado |"
            echo "|---|---|---|"
            echo "| 1 | static-analysis | $STATIC |"
            echo "| 1 | security | $SECURITY |"
            echo "| 2 | unit-tests | $UNIT |"
            echo "| 3 | integration-tests | $INTEGRATION |"
            echo "| 4 | acceptance-tests | $ACCEPTANCE |"
            echo "| 5 | performance-tests | $PERFORMANCE |"
          } >> "$GITHUB_STEP_SUMMARY"
          # "skipped" también reprueba: significa que una etapa anterior falló.
          for result in "$STATIC" "$SECURITY" "$UNIT" "$INTEGRATION" "$ACCEPTANCE" "$PERFORMANCE"; do
            if [ "$result" != "success" ]; then
              echo "**Reprobado:** al menos una etapa no terminó en verde. El PR no se puede mergear." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Quality gate reprobado (static=$STATIC, security=$SECURITY, unit=$UNIT, integration=$INTEGRATION, acceptance=$ACCEPTANCE, performance=$PERFORMANCE)."
              exit 1
            fi
          done
          echo "**Aprobado:** todas las etapas terminaron en verde." >> "$GITHUB_STEP_SUMMARY"
